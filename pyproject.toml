[project]
name = "talent-attrition-prediction"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "MNAtthoriq", email = "mnatthoriq@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
]

[project.scripts]
talent-attrition-prediction = "talent_attrition_prediction:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
